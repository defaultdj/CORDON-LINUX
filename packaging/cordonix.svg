<?xml version="1.0" encoding="UTF-8"?>
<!-- CORDON-LINUX Application Icon: Radiation Hazard Trefoil in amber S.T.A.L.K.E.R. style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24201c"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <!-- Background metallic badge -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#bg)" stroke="#ffab00" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#3a3228" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Radiation Symbol (Trefoil) -->
  <!-- Top blade (240° to 300°) -->
  <path d="M 64,64 L 45,31.1 A 38,38 0 0,1 83,31.1 Z" fill="url(#amber)"/>
  <!-- Bottom right blade (0° to 60°) -->
  <path d="M 64,64 L 102,64 A 38,38 0 0,1 83,96.9 Z" fill="url(#amber)"/>
  <!-- Bottom left blade (120° to 180°) -->
  <path d="M 64,64 L 45,96.9 A 38,38 0 0,1 26,64 Z" fill="url(#amber)"/>

  <!-- Inner mask circle & Center hub -->
  <circle cx="64" cy="64" r="18" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="11" fill="url(#amber)"/>
  <circle cx="64" cy="64" r="5" fill="#12100e"/>
</svg>
